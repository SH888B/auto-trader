[project]
name = "auto-trader"
version = "0.4.0"
description = "首分机器人：数据、复盘、交易、执行与评价分离的研究系统"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "jsonschema>=4.26.0",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "tabulate>=0.9",  # build_snapshot.py 的 VERIFY_report.md 用 DataFrame.to_markdown() 输出
]

[project.scripts]
auto-trader = "autotrader.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autotrader"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.uv]
# 包管理纪律：新增依赖必须在此声明并记录原因，禁止 pip 直装
package = true
